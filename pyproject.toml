[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termbrow"
version = "1.0.4"
description = "A clickable, ad-free terminal browser for reading and research"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "k-luecke" }]
keywords = ["terminal", "browser", "tui", "reader", "textual", "research"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "textual>=8.0",
    "httpx[socks]>=0.27",
    "trafilatura>=2.0",
    "feedparser>=6.0",
    "browser_cookie3>=0.19",
]

[project.urls]
Homepage = "https://github.com/k-luecke/TermBrow"
Repository = "https://github.com/k-luecke/TermBrow"
Issues = "https://github.com/k-luecke/TermBrow/issues"

# This is the whole point of packaging: after install, users just run `termbrow`.
[project.scripts]
termbrow = "termbrow.app:main"

[tool.setuptools.packages.find]
include = ["termbrow*"]
